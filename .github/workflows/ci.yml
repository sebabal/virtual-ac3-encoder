name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  engine:
    name: Engine build + unit tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # FFmpeg shared dev libs are not committed; cache them across runs.
      - name: Cache FFmpeg dev libs
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.ps1') }}

      - name: Fetch FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Configure (CMake, VS 2022 x64)
        run: cmake -S engine -B engine/build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: cmake --build engine/build --config Release

      - name: Unit tests (ctest)
        run: ctest --test-dir engine/build -C Release --output-on-failure

      - name: Offline encoder smoke test (WAV -> AC3/IEC61937)
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress | Out-Null
          $env:Path += ';C:\ProgramData\chocolatey\bin'
          ./scripts/make-test-wav.ps1
          ./engine/build/Release/encode_wav.exe ./engine/test/test_5p1.wav ./out.spdif
          # Confirm the output really is AC3 inside IEC 61937.
          $probe = ffprobe -hide_banner -f spdif ./out.spdif 2>&1 | Out-String
          Write-Host $probe
          if ($probe -notmatch 'ac3') { throw "Output did not demux as AC3" }
