name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.1.0 (a v<version> tag/release is created)'
        required: true

permissions:
  contents: write   # create releases + tags

jobs:
  release:
    name: Build portable zip + installer, publish release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}" -replace '^v','' }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $v"

      - name: Cache FFmpeg dev libs
        id: ffcache
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.ps1') }}

      - name: Fetch FFmpeg
        if: steps.ffcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Configure + build (Release)
        shell: pwsh
        run: |
          cmake -S engine -B engine/build -G "Visual Studio 17 2022" -A x64 "-DVAC3_VERSION=${{ steps.ver.outputs.version }}"
          cmake --build engine/build --config Release

      - name: Assemble dist staging
        shell: pwsh
        run: |
          $d = "dist"
          New-Item -ItemType Directory -Force -Path "$d/scripts" | Out-Null
          Copy-Item engine/build/Release/engine.exe $d
          Copy-Item engine/build/Release/*.dll $d
          foreach ($x in 'VCRUNTIME140.dll','VCRUNTIME140_1.dll','MSVCP140.dll') {
            Copy-Item "$env:WINDIR/System32/$x" $d -Force
          }
          Copy-Item scripts/*.ps1 "$d/scripts"
          Copy-Item README.md,LICENSE,NOTICE.md,CLAUDE.md $d
          Copy-Item installer/supervisor.vbs,installer/stop-engine.ps1 $d
          Copy-Item installer/quickstart.txt "$d/QUICKSTART.txt"
          Copy-Item installer/default.conf "$d/virtual-ac3-encoder.conf"
          Get-ChildItem $d

      - name: Create portable zip
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath "virtual-ac3-encoder-${{ steps.ver.outputs.version }}-win64.zip" -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            $iscc = if ($cmd) { $cmd.Source } else { "$env:ProgramData\chocolatey\bin\ISCC.exe" }
          }
          $src = (Resolve-Path dist).Path
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=$src" installer/virtual-ac3-encoder.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $tag = "v$ver"
          $zip = "virtual-ac3-encoder-$ver-win64.zip"
          $exe = "installer/Output/virtual-ac3-encoder-setup-$ver.exe"
          $notes = @"
          Real-time multichannel PCM -> AC3 (Dolby Digital) -> IEC 61937 / S-PDIF (Toslink) encoder for Windows.
          A software ``Dolby Digital Live`` / ``DTS Connect``-style tool (SoundPusher-for-Windows).

          ## Downloads
          - **virtual-ac3-encoder-setup-$ver.exe** - installer (per-user, no admin); auto-starts at logon.
          - **$zip** - portable build (extract and run ``engine.exe``; see ``QUICKSTART.txt``).

          ## Requires
          A virtual audio cable to capture surround audio - install **VB-CABLE** (https://vb-audio.com/Cable/),
          set ``CABLE Input`` as the default 5.1 device. And an optical output that does AC3 passthrough.
          (Our own kernel virtual device is in ``driver/`` but needs Secure Boot off / signing; see README.)

          FFmpeg (LGPL) DLLs are bundled; see NOTICE.md for third-party attributions.
          "@
          gh release create $tag --title "v$ver" --notes $notes $zip $exe
